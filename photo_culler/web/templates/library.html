{% extends "base.html" %}

{% block title %}Biblioteca - Photo Culler{% endblock %}

{% block content %}
<div class="header-bar">
  <h1>Biblioteca de Fotografías</h1>
  <div style="font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; background: rgba(255, 255, 255, 0.05); padding: 4px 12px; border-radius: 9999px;">
    Total: <span style="color: #ffffff;">{{ photos|length }}</span> fotos
  </div>
</div>

<div class="photo-grid">
  {% for photo in photos %}
    {% include "partials/photo_card.html" %}
  {% endfor %}
</div>
{% endblock %}
