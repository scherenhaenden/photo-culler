<a href="/photos/{{ photo.photo_id }}{% if group_id %}?group={{ group_id }}{% endif %}" class="photo-card" id="photo-card-{{ photo.photo_id }}">
  <div class="thumbnail-wrapper">
    <img src="/thumbnails/{{ photo.photo_id }}/800?representation={{ representation|default('jpeg') }}" alt="{{ photo.stem_name }}" loading="lazy">
  </div>
  <div class="photo-meta">
    <div class="photo-stem">{{ photo.stem_name }}</div>
    <div class="photo-badge-row">
      {% set d_val = photo.decision.value if photo.decision.value is defined else photo.decision %}
      <span class="photo-badge badge-{{ d_val|lower }}">{{ d_val }}</span>
      {% if photo.availability_status != 'present' %}
      <span class="photo-badge">{{ photo.availability_status }}</span>
      {% endif %}
      <span class="photo-score-label">Score: <span>{{ (photo.score * 100)|round|int }}%</span></span>
    </div>
  </div>
</a>
