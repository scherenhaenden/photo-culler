[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-culler"
version = "0.1.0"
description = "High performance automated photo culling and modular analysis framework"
authors = [{ name = "Edward Flores" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pillow>=9.0.0",
    "numpy>=1.21.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
photo-culler = "photo_culler.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["photo_culler"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 1
