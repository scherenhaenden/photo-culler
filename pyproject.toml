[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-culler"
version = "0.1.0"
description = "High performance automated photo culling and modular analysis framework"
authors = [{ name = "Edward Flores" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pillow>=9.0.0",
    "numpy>=1.21.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
photo-culler = "photo_culler.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
