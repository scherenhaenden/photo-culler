name: Rust Slint demo artifacts

on:
  pull_request:
    branches: [feature/sprint-01-rust-foundation]
    paths:
      - 'rust/apps/photo-culler-slint/**'
      - 'migration/demo/**'
      - 'docs/rust-slint-demo/**'
      - '.github/workflows/rust-slint-demo.yml'
  push:
    branches: [feature/sprint-01-rust-foundation]
    paths:
      - 'rust/apps/photo-culler-slint/**'
      - 'migration/demo/**'
      - 'docs/rust-slint-demo/**'
      - '.github/workflows/rust-slint-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    name: macOS arm64 build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run recipe when integrated
        id: build
        shell: bash
        run: |
          mkdir -p artifacts/macos-arm64
          recipe=migration/demo/build/macos/build.sh
          if [[ -f "$recipe" ]]; then
            bash "$recipe" --build artifacts/macos-arm64 "$PWD"
            status=built
          else
            echo "D18 recipe is not integrated yet; artifact is a build-status manifest only."
            status=blocked_missing_recipe
          fi
          rustc_version="$(rustc --version)"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust/Cargo.toml | head -1)"
          sha="$(git rev-parse HEAD)"
          printf '{"schema_version":1,"visible_version":"%s","sha":"%s","toolchain":"%s","target":"aarch64-apple-darwin","status":"%s"}\n' "$version" "$sha" "$rustc_version" "$status" > artifacts/macos-arm64/artifact-manifest.json
          : > artifacts/macos-arm64/checksums.sha256
          while IFS= read -r -d '' file; do shasum -a 256 "$file" >> artifacts/macos-arm64/checksums.sha256; done < <(find artifacts/macos-arm64 -type f ! -name checksums.sha256 ! -name artifact-manifest.json -print0 | sort -z)
      - uses: actions/upload-artifact@v4
        with:
          name: rust-slint-demo-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/macos-arm64/

  linux-x64:
    name: Linux x86-64 build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux fontconfig system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - name: Run recipe when integrated
        shell: bash
        run: |
          mkdir -p artifacts/linux-x64
          recipe=migration/demo/build/linux/build.sh
          if [[ -f "$recipe" ]]; then
            bash "$recipe" --build artifacts/linux-x64 "$PWD"
            status=built
          else
            echo "D29 recipe is not integrated yet; artifact is a build-status manifest only."
            status=blocked_missing_recipe
          fi
          rustc_version="$(rustc --version)"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust/Cargo.toml | head -1)"
          sha="$(git rev-parse HEAD)"
          printf '{"schema_version":1,"visible_version":"%s","sha":"%s","toolchain":"%s","target":"x86_64-unknown-linux-gnu","status":"%s"}\n' "$version" "$sha" "$rustc_version" "$status" > artifacts/linux-x64/artifact-manifest.json
          : > artifacts/linux-x64/checksums.sha256
          while IFS= read -r -d '' file; do sha256sum "$file" >> artifacts/linux-x64/checksums.sha256; done < <(find artifacts/linux-x64 -type f ! -name checksums.sha256 ! -name artifact-manifest.json -print0 | sort -z)
      - uses: actions/upload-artifact@v4
        with:
          name: rust-slint-demo-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/linux-x64/

  windows-x64:
    name: Windows x86-64 build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Run recipe when integrated and write manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows-x64 | Out-Null
          $recipe = 'migration/demo/build/windows/build.ps1'
          if (Test-Path $recipe) {
            & $recipe -Mode Build -OutputDirectory artifacts/windows-x64 -WorkspaceRoot $PWD
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $status = 'built'
          } else {
            Write-Host 'D31 recipe is not integrated yet; artifact is a build-status manifest only.'
            $status = 'blocked_missing_recipe'
          }
          $version = (Select-String -Path rust/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $manifest = @{ schema_version = 1; visible_version = $version; sha = (git rev-parse HEAD); toolchain = (rustc --version); target = 'x86_64-pc-windows-msvc'; status = $status }
          $manifest | ConvertTo-Json -Compress | Set-Content -Encoding utf8 artifacts/windows-x64/artifact-manifest.json
          Get-ChildItem artifacts/windows-x64 -Recurse -File | Where-Object { $_.Name -ne 'checksums.sha256' -and $_.Name -ne 'artifact-manifest.json' } | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path.Substring((Get-Location).Path.Length + 1))" } | Set-Content artifacts/windows-x64/checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rust-slint-demo-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/windows-x64/

  wasm32:
    name: WASM build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install locked wasm-bindgen CLI
        shell: bash
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ { in_package=1; next } in_package && /^version = / { gsub(/"/, "", $3); print $3; exit } in_package && /^\[/ { in_package=0 }' rust/Cargo.lock)"
          if [[ -z "$version" ]]; then echo 'wasm-bindgen is not pinned in Cargo.lock'; exit 2; fi
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build the Slint WASM package when integrated
        shell: bash
        run: |
          mkdir -p artifacts/wasm32
          if [[ -x migration/demo/build/wasm/build.sh ]]; then
            WEB_OUT_DIR="$PWD/artifacts/wasm32" migration/demo/build/wasm/build.sh
            status=built
          else
            echo 'D20 WASM recipe is not integrated yet; artifact is a build-status manifest only.'
            status=blocked_missing_recipe
          fi
          rustc_version="$(rustc --version)"
          bindgen_version="$(wasm-bindgen --version)"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust/Cargo.toml | head -1)"
          sha="$(git rev-parse HEAD)"
          printf '{"schema_version":1,"visible_version":"%s","sha":"%s","toolchain":"%s","wasm_bindgen":"%s","target":"wasm32-unknown-unknown","status":"%s"}\n' "$version" "$sha" "$rustc_version" "$bindgen_version" "$status" > artifacts/wasm32/artifact-manifest.json
          find artifacts/wasm32 -type f ! -name checksums.sha256 ! -name artifact-manifest.json -print0 | sort -z | xargs -0 -r sha256sum > artifacts/wasm32/checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rust-slint-demo-wasm32-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/wasm32/

  browser-smoke:
    name: Browser fixture smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runner
        run: npm install --no-save --package-lock=false playwright@1.51.1
      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox
      - name: Run Chromium fixture smoke when integrated
        shell: bash
        run: |
          if [[ -f migration/demo/smoke/chromium/package.json ]]; then
            (cd migration/demo/smoke/chromium && npm test) | tee chromium-smoke.log
          else
            echo 'D24 smoke is not integrated yet.' | tee chromium-smoke.log
          fi
      - name: Run Firefox fixture smoke when integrated
        shell: bash
        run: |
          if [[ -f migration/demo/smoke/firefox/package.json ]]; then
            (cd migration/demo/smoke/firefox && npm test) | tee firefox-smoke.log
          else
            echo 'D25 smoke is not integrated yet.' | tee firefox-smoke.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-slint-demo-browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: '*-smoke.log'
