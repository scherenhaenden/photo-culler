name: Rust Slint demo artifacts

on:
  pull_request:
    branches: [feature/sprint-01-rust-foundation]
    paths:
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'rust/crates/**'
      - 'rust/apps/photo-culler-server/**'
      - 'rust/apps/photo-culler-slint/**'
      - 'migration/demo/contract/**'
      - 'migration/demo/fixture/**'
      - 'migration/demo/harness/**'
      - 'migration/demo/build/**'
      - 'migration/demo/smoke/**'
      - '.github/workflows/rust-slint-demo.yml'
  push:
    branches: [feature/sprint-01-rust-foundation]
    paths:
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'rust/crates/**'
      - 'rust/apps/photo-culler-server/**'
      - 'rust/apps/photo-culler-slint/**'
      - 'migration/demo/contract/**'
      - 'migration/demo/fixture/**'
      - 'migration/demo/harness/**'
      - 'migration/demo/build/**'
      - 'migration/demo/smoke/**'
      - '.github/workflows/rust-slint-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build:
    name: ${{ matrix.name }} compile and stage
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: macos-arm64
            name: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            server_binary: photo-culler-server
          - key: linux-x64
            name: Linux x86-64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            server_binary: photo-culler-server
          - key: windows-x64
            name: Windows x86-64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            server_binary: photo-culler-server.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: runner.os == 'Linux'
        name: Install Slint native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libfontconfig1-dev libx11-dev libx11-xcb-dev libxcb1-dev xinput libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libinput-dev libgbm-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Require and run native package build recipe
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -x migration/demo/build/ci/build-native.sh
          migration/demo/build/ci/build-native.sh '${{ matrix.target }}' "$GITHUB_WORKSPACE/artifacts/${{ matrix.key }}" "$GITHUB_WORKSPACE"
      - name: Require and run Windows package build recipe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'migration/demo/build/ci/build-native.ps1' -PathType Leaf)) { throw 'required Windows CI build recipe is missing' }
          ./migration/demo/build/ci/build-native.ps1 -Target '${{ matrix.target }}' -OutputDirectory "$env:GITHUB_WORKSPACE/artifacts/${{ matrix.key }}" -WorkspaceRoot "$env:GITHUB_WORKSPACE"
      - name: Test owned desktop server launch and shutdown
        env:
          PHOTO_CULLER_SERVER: ${{ github.workspace }}/rust/target/${{ matrix.target }}/release/${{ matrix.server_binary }}
        run: cargo test --locked --manifest-path rust/Cargo.toml --release --target '${{ matrix.target }}' -p photo-culler-slint --lib owned_server::tests::owned_child_serves_the_gallery_and_releases_its_port_on_drop -- --ignored
      - uses: actions/upload-artifact@v4
        with:
          name: rust-slint-demo-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/${{ matrix.key }}/
          if-no-files-found: error

  wasm-build:
    name: WASM compile and web bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI locked to Cargo.lock
        shell: bash
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ { in_package=1; next } in_package && /^version = / { gsub(/"/, "", $3); print $3; exit } in_package && /^\[/ { in_package=0 }' rust/Cargo.lock)"
          test -n "$version"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Require and run WASM build recipe
        shell: bash
        run: |
          test -x migration/demo/build/ci/build-wasm.sh
          migration/demo/build/ci/build-wasm.sh "$GITHUB_WORKSPACE/artifacts/wasm32" "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-slint-demo-wasm32-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/wasm32/
          if-no-files-found: error

  recipe-contracts:
    name: Build recipe and staging contract checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate registered packages and exact manifests
        run: python3 migration/demo/build/ci/verify-packages.py "$GITHUB_WORKSPACE"
      - name: Test WASM build preflight failure modes
        run: bash migration/demo/build/wasm/test.sh
      - name: Test web bundle staging and validation
        run: bash migration/demo/build/web-dist/test.sh
      - name: Test native staging on paths with spaces
        run: |
          bash migration/demo/build/macos/test-stage.sh
          bash migration/demo/build/linux/test-stage.sh
      - name: Test Windows staging contract
        shell: pwsh
        run: ./migration/demo/build/windows/test-stage.ps1
      - name: Test no-Python process-tree contract
        run: bash migration/demo/smoke/no-python/test.sh

  browser-application-smoke:
    name: Chromium and Firefox against Rust server and application WASM
    runs-on: ubuntu-24.04
    needs: wasm-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: rust-slint-demo-wasm32-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/wasm32/
      - name: Build the real Rust API server
        run: cargo build --locked --manifest-path rust/Cargo.toml --release --package photo-culler-server
      - name: Require live browser smoke recipes
        run: |
          test -f migration/demo/smoke/chromium/package.json
          test -f migration/demo/smoke/chromium/smoke.mjs
          test -f migration/demo/smoke/firefox/package.json
          test -f migration/demo/smoke/firefox/smoke.mjs
          test -f migration/demo/smoke/live-smoke.mjs
      - name: Install pinned browser test runner
        run: npm install --no-save --package-lock=false playwright@1.51.1
      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox
      - name: Run Chromium with real Axum and WASM artifacts
        env:
          PHOTO_CULLER_SERVER: ${{ github.workspace }}/rust/target/release/photo-culler-server
          PHOTO_CULLER_WEB_ROOT: ${{ github.workspace }}/artifacts/wasm32/bundle
          PHOTO_CULLER_SCREENSHOT: ${{ github.workspace }}/artifacts/browser-smoke/chromium.png
        run: |
          mkdir -p artifacts/browser-smoke
          (cd migration/demo/smoke/chromium && npm test)
      - name: Run Firefox with real Axum and WASM artifacts
        env:
          PHOTO_CULLER_SERVER: ${{ github.workspace }}/rust/target/release/photo-culler-server
          PHOTO_CULLER_WEB_ROOT: ${{ github.workspace }}/artifacts/wasm32/bundle
          PHOTO_CULLER_SCREENSHOT: ${{ github.workspace }}/artifacts/browser-smoke/firefox.png
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" bash -c 'cd migration/demo/smoke/firefox && npm test'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-slint-demo-browser-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser-smoke/
          if-no-files-found: warn
