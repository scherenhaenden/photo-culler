name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust workspace checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native build dependencies
        run: |
          packages=(build-essential pkg-config libfontconfig1-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libinput-dev libgbm-dev libwayland-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev)
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y "${packages[@]}"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - name: Run Clippy
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets --all-features
      - name: Run Rust tests
        run: cargo test --locked --manifest-path rust/Cargo.toml --workspace
