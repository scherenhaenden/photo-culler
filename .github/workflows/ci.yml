name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: ruff check photo_culler tests
      - run: ruff format --check photo_culler tests

  python-typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: mypy --follow-imports=skip photo_culler/importing photo_culler/web/routes/api.py

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: pytest -m 'not e2e' --cov=photo_culler --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  python-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: pytest -m e2e tests/e2e

  rust-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  linux-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e '.[build,test]'
      - run: ./scripts/build_linux.sh
      - run: test -x builds/linux/photo-culler

  tauri-linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update
      - run: sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - run: python -m pip install -e '.[build,test]'
      - run: PHOTO_CULLER_TAURI_BUILD_DIR="$GITHUB_WORKSPACE/builds/linux/tauri-webgl" ./scripts/build_tauri_linux.sh
      - run: PHOTO_CULLER_TAURI_DEB="$GITHUB_WORKSPACE/builds/linux/tauri-webgl/Photo Culler_0.1.0_amd64.deb" xvfb-run -a pytest -m e2e tests/e2e/test_tauri_desktop_package.py
