name: Release desktop build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e '.[build]'
      - run: ./scripts/build_linux.sh
      - run: tar -C builds/linux/chromium -czf photo-culler-linux-chromium-x86_64.tar.gz photo-culler README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: photo-culler-linux-chromium-x86_64
          path: photo-culler-linux-chromium-x86_64.tar.gz
          if-no-files-found: error

  github-release:
    if: github.event_name == 'push'
    needs: linux-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: photo-culler-linux-chromium-x86_64
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: photo-culler-linux-chromium-x86_64.tar.gz
