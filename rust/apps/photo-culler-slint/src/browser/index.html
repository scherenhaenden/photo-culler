<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Photo Culler</title>
    <style>
      :root { font: 16px system-ui, sans-serif; color: #f2f2f2; background: #17191d; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(48rem, calc(100% - 3rem)); }
      #diagnostic { padding: 1rem 1.25rem; border: 1px solid #8b5e20; border-radius: .5rem; background: #302613; }
      #diagnostic[hidden] { display: none; }
      a { color: #9acbff; }
      canvas { display: block; width: 100vw; height: 100vh; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    </style>
  </head>
  <body>
    <main id="diagnostic" role="alert" aria-live="assertive" hidden>
      <h1 id="diagnostic-title"></h1>
      <p id="diagnostic-message"></p>
      <p>To continue, enable WebGL and reload this page, or start Photo Culler Desktop on this computer.</p>
    </main>
    <canvas id="canvas" aria-label="Photo Culler"></canvas>
    <div id="application-status" class="sr-only" role="status" aria-live="polite" data-state="loading">Loading gallery</div>
    <script type="module" src="./bootstrap.js"></script>
  </body>
</html>
