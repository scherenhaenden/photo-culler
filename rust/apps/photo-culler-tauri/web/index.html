<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Photo Culler — Tauri/WebGL bootstrap</title>
    <style>
      html, body, canvas { width: 100%; height: 100%; margin: 0; background: #090b10; color: #f7f7f8; }
      aside { position: fixed; z-index: 1; padding: 24px; font: 14px system-ui; }
    </style>
  </head>
  <body>
    <aside>Tauri + WebGL rendering bootstrap</aside>
    <canvas id="viewport"></canvas>
    <script>
      const canvas = document.querySelector("#viewport");
      const gl = canvas.getContext("webgl2");
      function draw() {
        canvas.width = innerWidth * devicePixelRatio;
        canvas.height = innerHeight * devicePixelRatio;
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.clearColor(0.035, 0.043, 0.063, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
      }
      addEventListener("resize", draw);
      draw();
    </script>
  </body>
</html>
