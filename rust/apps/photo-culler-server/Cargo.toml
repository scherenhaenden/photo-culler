[package]
name = "photo-culler-server"
version = "2026.11.18+18.43.40"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.7"
photo-culler-api = { path = "../../crates/photo-culler-api" }
photo-culler-core.workspace = true
photo-culler-image-engine = { path = "../../crates/photo-culler-image-engine" }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
sha2 = "0.10.9"
getrandom = "0.3.4"
image.workspace = true
libsqlite3-sys = { version = "0.30.1", default-features = false }
tokio = {
    version = "1",
    features = [
        "io-std",
        "io-util",
        "macros",
        "net",
        "process",
        "rt-multi-thread",
        "signal",
    ],
}

[dev-dependencies]
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }
